<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Mantra · 排版编辑器</title>
<style>
:root{
  --paper:#ECE8E0; --sheet:#F6F4EF; --panel:#FFFFFF; --ink:#141414; --muted:#6D6A63;
  --line:rgba(20,20,20,.12); --cobalt:#1F3FB0; --cobalt-soft:rgba(31,63,176,.10);
  --danger:#C0392B; --radius:10px; --shadow:0 2px 12px rgba(20,20,20,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--paper);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
  color:var(--ink);border-radius:8px;padding:6px 11px;transition:.15s}
button:hover{border-color:var(--cobalt);color:var(--cobalt)}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
button.primary{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
button.primary:hover{background:#182f8f;color:#fff}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--cobalt-soft)}
.icon-btn{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;border-color:transparent;background:transparent}
.icon-btn:hover{background:var(--cobalt-soft);border-color:transparent}
.icon-btn svg{width:16px;height:16px}

#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
/* ---------- 顶部工具栏 ---------- */
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--line);z-index:5}
#topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;margin-right:6px}
#topbar .brand .dot{width:20px;height:20px;border-radius:6px;background:var(--cobalt);display:inline-flex;
  align-items:center;justify-content:center;color:#fff;font-size:12px}
#projectName{border:1px solid transparent;background:transparent;font-weight:600;padding:4px 7px;border-radius:6px;
  width:180px}
#projectName:hover,#projectName:focus{border-color:var(--line);outline:none;background:#fff}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
#saveState{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;min-width:74px}
#saveState .led{width:7px;height:7px;border-radius:50%;background:#2e9e5b}
#saveState.saving .led{background:#e0a526}
.spacer{flex:1}

/* ---------- 三栏布局 ---------- */
#workspace{display:grid;grid-template-columns:236px 1fr 248px;min-height:0}
#left,#right{background:var(--panel);overflow-y:auto;overflow-x:hidden}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between}
.sec h3 .add{font-size:18px;line-height:1;color:var(--cobalt);border:none;background:none;padding:0 2px}
.row{display:flex;gap:6px;align-items:center}

/* 页面列表 */
.page-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;margin-bottom:3px;
  cursor:pointer;border:1px solid transparent}
.page-item:hover{background:var(--cobalt-soft)}
.page-item.active{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.page-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-item .del{opacity:0;font-size:15px;color:var(--muted);border:none;background:none;padding:0 3px}
.page-item:hover .del{opacity:1}
.page-item .del:hover{color:var(--danger)}

/* 资产库 */
#assetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.asset{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  cursor:pointer;background:var(--sheet);transition:.12s}
.asset:hover{border-color:var(--cobalt);transform:translateY(-1px);box-shadow:var(--shadow)}
.asset img{width:100%;height:100%;object-fit:cover;display:block}
.asset .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,20,.62);color:#fff;
  font-size:9px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .rm{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:rgba(20,20,20,.7);color:#fff;border:none;font-size:11px;line-height:17px;padding:0;display:none}
.asset:hover .rm{display:block}
.upload-btn{width:100%;border-style:dashed;color:var(--cobalt);padding:9px;margin-bottom:9px}

/* 画布区 */
#center{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 0%,#fbfaf7,#e9e5dc);display:flex;align-items:center;justify-content:center}
#viewport{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center}
#stageWrap{position:relative;transform-origin:center center}
#canvas{position:relative;background:var(--paper);box-shadow:0 8px 40px rgba(20,20,20,.18);overflow:hidden}
.canvas-bg{position:absolute;inset:0;pointer-events:none}
.el{position:absolute;user-select:none;cursor:grab;touch-action:none}
.el:active{cursor:grabbing}
.el.locked{cursor:not-allowed}
.el.hidden-el{display:none}
.el img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
#selbox{position:absolute;pointer-events:none;z-index:99999;display:none}
#selbox .frame{position:absolute;inset:0;border:1.5px solid var(--cobalt);pointer-events:none}
.handle{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--cobalt);
  border-radius:50%;pointer-events:auto}
.handle[data-h="nw"]{left:-6px;top:-6px;cursor:nwse-resize}
.handle[data-h="ne"]{right:-6px;top:-6px;cursor:nesw-resize}
.handle[data-h="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}
.handle[data-h="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}
.handle[data-h="n"]{left:50%;top:-6px;transform:translateX(-50%);cursor:ns-resize}
.handle[data-h="s"]{left:50%;bottom:-6px;transform:translateX(-50%);cursor:ns-resize}
.handle[data-h="e"]{top:50%;right:-6px;transform:translateY(-50%);cursor:ew-resize}
.handle[data-h="w"]{top:50%;left:-6px;transform:translateY(-50%);cursor:ew-resize}
#rotateHandle{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:16px;height:16px;
  background:var(--cobalt);border:2px solid #fff;border-radius:50%;cursor:grab;pointer-events:auto;
  box-shadow:0 1px 4px rgba(0,0,0,.3)}
#rotateLine{position:absolute;left:50%;top:-16px;width:1.5px;height:16px;background:var(--cobalt);
  transform:translateX(-50%);pointer-events:none}
#zoombar{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:5px 8px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);z-index:6}
#zoombar button{width:24px;height:24px;padding:0;border:none;background:none;font-size:16px}
#zoomLabel{min-width:44px;text-align:center;color:var(--muted)}

/* 图层列表 */
.layer{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);
  border-radius:7px;margin-bottom:4px;background:#fff;cursor:pointer}
.layer:hover{border-color:var(--cobalt)}
.layer.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.layer.dragover{border-top:2px solid var(--cobalt)}
.layer .thumb{width:26px;height:26px;border-radius:5px;object-fit:cover;background:var(--sheet);flex:none}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.layer .mini{width:20px;height:20px;padding:0;border:none;background:none;color:var(--muted);font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:5px}
.layer .mini:hover{background:var(--cobalt-soft);color:var(--cobalt)}
.layer .mini.off{opacity:.35}
.layer .mini.del:hover{color:var(--danger)}
.grip{cursor:grab;color:#bbb;font-size:12px;user-select:none}

/* 属性面板 */
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prop-row label{width:46px;color:var(--muted);font-size:12px;flex:none}
.prop-row input[type=range]{flex:1;accent-color:var(--cobalt)}
.prop-row .val{width:38px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.empty-hint{color:var(--muted);font-size:12px;line-height:1.7;padding:4px 2px}

/* 预览 & 提示 */
#preview{position:fixed;inset:0;background:var(--paper);z-index:9000;display:none;align-items:center;
  justify-content:center;overflow:auto}
#preview.on{display:flex}
#previewCanvas{position:relative;transform-origin:center center;box-shadow:0 8px 50px rgba(0,0,0,.2)}
#preview img{position:absolute;object-fit:contain}
#previewTip{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.82);
  color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;z-index:9001}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:9px 16px;border-radius:9px;font-size:12px;opacity:0;transition:.25s;z-index:9500;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
kbd{background:var(--sheet);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot">M</span><span>排版编辑器</span></div>
    <input id="projectName" value="未命名项目" title="项目名（点击改名）">
    <div class="sep"></div>
    <button id="btnUndo" title="撤销 Ctrl+Z">↶ 撤销</button>
    <div class="spacer"></div>
    <div id="saveState"><span class="led"></span><span class="txt">已保存</span></div>
    <button id="btnPreview" class="primary">▶ 预览</button>
    <button id="btnImport">导入</button>
    <button id="btnExport">导出</button>
  </div>

  <div id="workspace">
    <!-- 左栏 -->
    <div id="left">
      <div class="sec">
        <h3>页面 <button class="add" id="btnAddPage" title="新建页面">+</button></h3>
        <div id="pageList"></div>
      </div>
      <div class="sec">
        <h3>美术资产库 <span style="font-size:10px;color:var(--muted);font-weight:400">共用</span></h3>
        <button class="upload-btn" id="btnUpload">+ 上传透明图片</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <div id="assetGrid"></div>
      </div>
    </div>

    <!-- 中栏 -->
    <div id="center">
      <div id="viewport">
        <div id="stageWrap">
          <div id="canvas">
            <div class="canvas-bg" id="canvasBg"></div>
            <div id="selbox">
              <div class="frame"></div>
              <div class="handle" data-h="nw"></div><div class="handle" data-h="n"></div>
              <div class="handle" data-h="ne"></div><div class="handle" data-h="w"></div>
              <div class="handle" data-h="e"></div><div class="handle" data-h="sw"></div>
              <div class="handle" data-h="s"></div><div class="handle" data-h="se"></div>
              <div id="rotateLine"></div><div id="rotateHandle" title="拖动旋转"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="zoombar">
        <button id="zoomOut" title="缩小">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="放大">+</button>
        <button id="zoomFit" title="适应窗口" style="font-size:11px;width:auto;padding:0 6px">适应</button>
      </div>
    </div>

    <!-- 右栏 -->
    <div id="right">
      <div class="sec">
        <h3>图层 <span style="font-size:10px;color:var(--muted);font-weight:400">拖动排序 · 上为前</span></h3>
        <div id="layerList"></div>
      </div>
      <div class="sec">
        <h3>元素属性</h3>
        <div id="props"></div>
      </div>
      <div class="sec">
        <h3>画布</h3>
        <div class="prop-row"><label>背景</label><input type="color" id="canvasColor" value="#ECE8E0"></div>
        <div class="prop-row"><label>宽</label><input type="number" id="canvasW" value="1440" style="width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"></div>
        <div class="prop-row"><label>高</label><input type="number" id="canvasH" value="900" style="width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"></div>
        <div class="empty-hint" style="margin-top:8px">快捷键：<kbd>Del</kbd> 删除 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销 · <kbd>Esc</kbd> 取消选中</div>
      </div>
    </div>
  </div>
</div>

<div id="preview"><div id="previewTip">预览模式 · 按 Esc 返回编辑</div><div id="previewCanvas"></div></div>
<div id="toast"></div>

<script src="presets.js"></script>
<script>
"use strict";
(function(){
  const STORE_KEY="podcast-mantra-layout-v1";
  const CHANNEL="podcast-mantra-layout-sync";
  const CLIENT_ID=Math.random().toString(36).slice(2);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  const $=id=>document.getElementById(id);
  let project, undoStack=[], selectedId=null, viewScale=1, drag=null;
  let saveTimer=null, bc=null, applyingRemote=false;

  /* ---------- 默认数据 ---------- */
  function defaultProject(){
    const assets=(window.PRESET_ASSETS||[]).map((a,i)=>({id:"preset-"+i,name:a.name,data:a.data,preset:true}));
    return {
      v:1, updatedAt:Date.now(), name:"未命名项目",
      canvas:{w:1440,h:900,bg:"#ECE8E0"},
      assets,
      pages:[{id:uid(),name:"页面 1",elements:[]}],
      activePageId:null
    };
  }
  function normalize(p){
    if(!p||typeof p!=="object") return defaultProject();
    p.v=p.v||1; p.assets=Array.isArray(p.assets)?p.assets:[];
    p.pages=Array.isArray(p.pages)&&p.pages.length?p.pages:defaultProject().pages;
    p.canvas=p.canvas||{w:1440,h:900,bg:"#ECE8E0"};
    p.pages.forEach(pg=>{pg.id=pg.id||uid();pg.name=pg.name||"页面";pg.elements=Array.isArray(pg.elements)?pg.elements:[];});
    p.activePageId=p.pages.some(pg=>pg.id===p.activePageId)?p.activePageId:p.pages[0].id;
    p.name=p.name||"未命名项目"; p.updatedAt=p.updatedAt||Date.now();
    return p;
  }

  /* ---------- 存取 & 同步 ---------- */
  function load(){
    try{const raw=localStorage.getItem(STORE_KEY);project=raw?normalize(JSON.parse(raw)):defaultProject();}
    catch(e){project=defaultProject();}
    if(!project.activePageId) project.activePageId=project.pages[0].id;
  }
  function persist(broadcast=true){
    project.updatedAt=Date.now();
    try{localStorage.setItem(STORE_KEY,JSON.stringify(project));}
    catch(e){toast("本地空间不足，请减少图片数量");}
    setSaveState("saving");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>setSaveState(""),500);
    if(broadcast&&bc) bc.postMessage({from:CLIENT_ID,data:project});
  }
  function setSaveState(s){
    const el=$("saveState");
    el.className=s;
    el.querySelector(".txt").textContent=s==="saving"?"保存中…":"已保存";
  }
  function snapshot(){undoStack.push(JSON.stringify(project));if(undoStack.length>60)undoStack.shift();updateUndoBtn();}
  function updateUndoBtn(){$("btnUndo").disabled=undoStack.length===0;}
  function undo(){
    if(!undoStack.length)return;
    project=normalize(JSON.parse(undoStack.pop()));
    if(!project.pages.some(p=>p.id===selectedPageId())) project.activePageId=project.pages[0].id;
    selectedId=null;renderAll();persist();updateUndoBtn();toast("已撤销");
  }

  /* ---------- 常用取数 ---------- */
  const selectedPage=()=>project.pages.find(p=>p.id===project.activePageId)||project.pages[0];
  const selectedPageId=()=>selectedPage().id;
  const findEl=id=>selectedPage().elements.find(e=>e.id===id);
  const findAsset=id=>project.assets.find(a=>a.id===id);

  /* ---------- 渲染 ---------- */
  function renderAll(){renderPages();renderAssets();renderCanvas();renderLayers();renderProps();renderCanvasSetup();}

  function renderPages(){
    const box=$("pageList");box.innerHTML="";
    project.pages.forEach((pg,i)=>{
      const d=document.createElement("div");
      d.className="page-item"+(pg.id===project.activePageId?" active":"");
      d.innerHTML='<span class="name">'+escapeHtml(pg.name)+'</span>'+
        (project.pages.length>1?'<button class="del" title="删除页面">×</button>':'');
      d.onclick=()=>{if(pg.id!==project.activePageId){selectedId=null;project.activePageId=pg.id;renderAll();persist();}};
      const del=d.querySelector(".del");
      if(del) del.onclick=e=>{e.stopPropagation();
        if(!confirm('删除页面「'+pg.name+'」？该页布局会被删除，但素材库不受影响。'))return;
        snapshot();project.pages=project.pages.filter(x=>x.id!==pg.id);
        if(project.activePageId===pg.id)project.activePageId=project.pages[0].id;
        selectedId=null;renderAll();persist();};
      d.ondblclick=()=>renamePage(pg);
      box.appendChild(d);
    });
    $("projectName").value=project.name;
  }
  function renamePage(pg){
    const n=prompt("页面名称",pg.name);
    if(n&&n.trim()){snapshot();pg.name=n.trim();renderPages();persist();}
  }
  function renderAssets(){
    const box=$("assetGrid");box.innerHTML="";
    project.assets.forEach(a=>{
      const d=document.createElement("div");d.className="asset";d.title="点击添加到画布 · "+a.name;
      d.innerHTML='<img src="'+a.data+'" alt=""><div class="cap">'+escapeHtml(a.name)+'</div><button class="rm" title="从素材库移除">×</button>';
      d.onclick=()=>addElement(a);
      d.querySelector(".rm").onclick=e=>{e.stopPropagation();
        if(!confirm('从素材库移除「'+a.name+'」？已放在画布上的实例不会受影响。'))return;
        snapshot();project.assets=project.assets.filter(x=>x.id!==a.id);renderAssets();persist();toast("已从素材库移除（画布实例保留）");};
      box.appendChild(d);
    });
  }
  function addElement(asset){
    snapshot();
    const c=project.canvas;
    const maxZ=Math.max(0,...selectedPage().elements.map(e=>e.z||0));
    const id=uid();
    selectedPage().elements.push({id,assetId:asset.id,x:Math.round(c.w/2-110),y:Math.round(c.h/2-110),
      w:220,h:220,rot:0,opacity:1,visible:true,locked:false,z:maxZ+1});
    selectedId=id;renderCanvas();renderLayers();renderProps();persist();toast("已添加「"+asset.name+"」");
  }
  function renderCanvas(){
    const c=project.canvas, canvas=$("canvas");
    canvas.style.width=c.w+"px";canvas.style.height=c.h+"px";
    $("canvasBg").style.background=c.bg;
    canvas.querySelectorAll(".el").forEach(n=>n.remove());
    // 按 z 从小到大绘制
    const els=selectedPage().elements.slice().sort((a,b)=>(a.z||0)-(b.z||0));
    els.forEach(e=>{
      const asset=findAsset(e.assetId);
      const d=document.createElement("div");
      d.className="el"+(e.locked?" locked":"")+(e.visible?"":" hidden-el");
      d.dataset.id=e.id;
      d.style.left=e.x+"px";d.style.top=e.y+"px";d.style.width=e.w+"px";d.style.height=e.h+"px";
      d.style.transform="rotate("+e.rot+"deg)";d.style.opacity=e.opacity;
      d.style.zIndex=e.z||0;
      if(asset) d.innerHTML='<img src="'+asset.data+'" alt="'+escapeHtml(asset.name)+'" draggable="false">';
      else d.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;'
        +'background:#ddd;color:#888;font-size:11px">素材已移除</div>';
      d.addEventListener("pointerdown",ev=>onElPointerDown(ev,e));
      canvas.insertBefore(d,$("selbox"));
    });
    updateSelbox();
    applyZoom();
  }
  function renderCanvasSetup(){
    const c=project.canvas;
    $("canvasColor").value=c.bg;
    if(document.activeElement!==$("canvasW"))$("canvasW").value=c.w;
    if(document.activeElement!==$("canvasH"))$("canvasH").value=c.h;
  }
  function renderLayers(){
    const box=$("layerList");box.innerHTML="";
    const list=selectedPage().elements.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    if(!list.length){box.innerHTML='<div class="empty-hint">画布上还没有元素。点击左侧素材添加。</div>';return;}
    list.forEach(e=>{
      const asset=findAsset(e.assetId);
      const d=document.createElement("div");
      d.className="layer"+(e.id===selectedId?" sel":"");
      d.draggable=true;d.dataset.id=e.id;
      d.innerHTML='<span class="grip">⠿</span>'+
        '<img class="thumb" src="'+(asset?asset.data:"")+'" alt="">'+
        '<span class="nm">'+(asset?escapeHtml(asset.name):"已移除素材")+'</span>'+
        '<button class="mini '+(e.visible?"":"off")+'" data-act="vis" title="显示/隐藏">'+(e.visible?"◉":"○")+'</button>'+
        '<button class="mini '+(e.locked?"":"off")+'" data-act="lock" title="锁定/解锁">'+(e.locked?"🔒":"🔓")+'</button>'+
        '<button class="mini del" data-act="del" title="删除">×</button>';
      d.onclick=()=>{selectedId=e.id;renderCanvas();renderLayers();renderProps();};
      d.querySelectorAll("[data-act]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();
        const act=b.dataset.act;
        if(act==="vis"){snapshot();e.visible=!e.visible;}
        else if(act==="lock"){snapshot();e.locked=!e.locked;}
        else if(act==="del"){snapshot();selectedPage().elements=selectedPage().elements.filter(x=>x.id!==e.id);
          if(selectedId===e.id)selectedId=null;toast("已删除画布元素（素材库不受影响）");}
        renderAll();persist();});
      // 拖拽排序
      d.ondragstart=ev=>{ev.dataTransfer.setData("text/plain",e.id);ev.dataTransfer.effectAllowed="move";};
      d.ondragover=ev=>{ev.preventDefault();d.classList.add("dragover");};
      d.ondragleave=()=>d.classList.remove("dragover");
      d.ondrop=ev=>{ev.preventDefault();d.classList.remove("dragover");
        const from=ev.dataTransfer.getData("text/plain");
        if(from&&from!==e.id){reorder(from,e.id);}};
      box.appendChild(d);
    });
  }
  function reorder(fromId,toId){
    snapshot();
    const els=selectedPage().elements;
    const from=els.findIndex(x=>x.id===fromId),to=els.findIndex(x=>x.id===toId);
    if(from<0||to<0)return;
    // 图层列表 z 从上到下为大到小；把 from 放到 to 的位置（z 重排）
    const byZ=els.slice().sort((a,b)=>(b.z||0)-(a.z||0));
    const fi=byZ.findIndex(x=>x.id===fromId),ti=byZ.findIndex(x=>x.id===toId);
    const [moved]=byZ.splice(fi,1);byZ.splice(ti,0,moved);
    byZ.forEach((e,i)=>e.z=byZ.length-i);
    renderAll();persist();
  }
  function renderProps(){
    const box=$("props"),e=findEl(selectedId);
    if(!e){box.innerHTML='<div class="empty-hint">选中画布上的元素后可调整属性。</div>';return;}
    const asset=findAsset(e.assetId);
    box.innerHTML=
      '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">已选中：<b style="color:var(--ink)">'+
        escapeHtml(asset?asset.name:"元素")+'</b></div>'+
      '<div class="prop-row"><label>透明度</label><input type="range" id="pOpacity" min="0" max="1" step="0.01" value="'+e.opacity+'"><span class="val" id="vOpacity">'+Math.round(e.opacity*100)+'%</span></div>'+
      '<div class="prop-row"><label>旋转</label><input type="range" id="pRot" min="-180" max="180" step="1" value="'+e.rot+'"><span class="val" id="vRot">'+Math.round(e.rot)+'°</span></div>'+
      '<div class="row" style="margin-top:12px;flex-wrap:wrap">'+
        '<button data-act="front">置顶</button><button data-act="back">置底</button>'+
        '<button data-act="dup">复制</button><button data-act="del" style="color:var(--danger)">删除</button>'+
      '</div>';
    $("pOpacity").oninput=ev=>{e.opacity=parseFloat(ev.target.value);$("vOpacity").textContent=Math.round(e.opacity*100)+"%";
      const node=canvasNode(e.id);if(node)node.style.opacity=e.opacity;};
    $("pOpacity").onchange=()=>persist();
    $("pRot").oninput=ev=>{e.rot=parseFloat(ev.target.value);$("vRot").textContent=Math.round(e.rot)+"°";
      const node=canvasNode(e.id);if(node)node.style.transform="rotate("+e.rot+"deg)";updateSelbox();};
    $("pRot").onchange=()=>persist();
    box.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const act=b.dataset.act;
      if(act==="front"){snapshot();e.z=Math.max(...selectedPage().elements.map(x=>x.z||0))+1;renderAll();persist();}
      if(act==="back"){snapshot();e.z=Math.min(...selectedPage().elements.map(x=>x.z||0))-1;
        // 归一化 z
        const els=selectedPage().elements.slice().sort((a,b)=>(a.z||0)-(b.z||0));els.forEach((x,i)=>x.z=i+1);renderAll();persist();}
      if(act==="dup"){snapshot();const c=project.canvas;const ne=Object.assign({},e,{id:uid(),x:e.x+20,y:e.y+20,
        z:Math.max(...selectedPage().elements.map(x=>x.z||0))+1});selectedPage().elements.push(ne);selectedId=ne.id;
        renderAll();persist();toast("已复制元素");}
      if(act==="del"){snapshot();selectedPage().elements=selectedPage().elements.filter(x=>x.id!==e.id);
        selectedId=null;renderAll();persist();toast("已删除画布元素（素材库不受影响）");}
    });
  }
  const canvasNode=id=>$("canvas").querySelector('.el[data-id="'+id+'"]');

  /* ---------- 选中框 ---------- */
  function updateSelbox(){
    const e=findEl(selectedId),box=$("selbox");
    if(!e||!e.visible){box.style.display="none";return;}
    box.style.display="block";
    box.style.left=e.x+"px";box.style.top=e.y+"px";
    box.style.width=e.w+"px";box.style.height=e.h+"px";
    box.style.transform="rotate("+e.rot+"deg)";
  }

  /* ---------- 指针交互：移动 / 缩放 / 旋转 ---------- */
  function onElPointerDown(ev,e){
    if(e.locked){selectedId=e.id;renderLayers();renderProps();updateSelbox();return;}
    ev.preventDefault();
    selectedId=e.id;renderLayers();renderProps();updateSelbox();
    drag={type:"move",id:e.id,startX:ev.clientX,startY:ev.clientY,orig:{x:e.x,y:e.y},moved:false};
    ev.currentTarget.setPointerCapture(ev.pointerId);
  }
  $("selbox").addEventListener("pointerdown",ev=>{
    const h=ev.target.closest(".handle");
    const r=ev.target.closest("#rotateHandle");
    const e=findEl(selectedId);if(!e||e.locked)return;
    if(h){
      ev.preventDefault();ev.stopPropagation();
      drag={type:"resize",id:e.id,handle:h.dataset.h,startX:ev.clientX,startY:ev.clientY,
        orig:{x:e.x,y:e.y,w:e.w,h:e.h,rot:e.rot},moved:false};
      h.setPointerCapture(ev.pointerId);
    }else if(r){
      ev.preventDefault();ev.stopPropagation();
      const rect=$("canvas").getBoundingClientRect();
      const cx=rect.left+(e.x+e.w/2)*viewScale, cy=rect.top+(e.y+e.h/2)*viewScale;
      drag={type:"rotate",id:e.id,cx,cy,startAngle:Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI,
        origRot:e.rot,moved:false};
      r.setPointerCapture(ev.pointerId);
    }
  });
  window.addEventListener("pointermove",ev=>{
    if(!drag)return;
    const e=findEl(drag.id);if(!e)return;
    const dx=(ev.clientX-drag.startX)/viewScale, dy=(ev.clientY-drag.startY)/viewScale;
    if(Math.abs(dx)>1||Math.abs(dy)>1)drag.moved=true;
    if(drag.type==="move"){
      e.x=Math.round(drag.orig.x+dx);e.y=Math.round(drag.orig.y+dy);
      const n=canvasNode(e.id);if(n){n.style.left=e.x+"px";n.style.top=e.y+"px";}
      updateSelbox();
    }else if(drag.type==="resize"){
      const rad=(-e.rot)*Math.PI/180,c=Math.cos(rad),s=Math.sin(rad);
      const lx=dx*c-dy*s, ly=dx*s+dy*c;
      const hd=drag.handle,o=drag.orig;
      let nw=o.w,nh=o.h,dlx=0,dly=0;
      if(hd.includes("e")){nw=o.w+lx;}
      if(hd.includes("w")){nw=o.w-lx;dlx=lx;}
      if(hd.includes("s")){nh=o.h+ly;}
      if(hd.includes("n")){nh=o.h-ly;dly=ly;}
      nw=Math.max(24,Math.round(nw));nh=Math.max(24,Math.round(nh));
      const back=o.rot*Math.PI/180,bc=Math.cos(back),bs=Math.sin(back);
      e.w=nw;e.h=nh;
      e.x=Math.round(o.x+dlx*bc-dly*bs);
      e.y=Math.round(o.y+dlx*bs+dly*bc);
      const n=canvasNode(e.id);if(n){n.style.width=e.w+"px";n.style.height=e.h+"px";n.style.left=e.x+"px";n.style.top=e.y+"px";}
      updateSelbox();
    }else if(drag.type==="rotate"){
      const a=Math.atan2(ev.clientY-drag.cy,ev.clientX-drag.cx)*180/Math.PI;
      let rot=drag.origRot+(a-drag.startAngle);
      if(ev.shiftKey)rot=Math.round(rot/15)*15;
      e.rot=Math.round(rot);
      const n=canvasNode(e.id);if(n)n.style.transform="rotate("+e.rot+"deg)";
      updateSelbox();
      const v=$("vRot");if(v)v.textContent=e.rot+"°";
      const p=$("pRot");if(p)p.value=e.rot;
    }
  });
  window.addEventListener("pointerup",()=>{
    if(!drag)return;
    if(drag.moved){persist();}
    drag=null;
  });

  /* ---------- 缩放视图 ---------- */
  function applyZoom(){
    const c=project.canvas;
    $("stageWrap").style.transform="scale("+viewScale+")";
    $("stageWrap").style.width=c.w+"px";$("stageWrap").style.height=c.h+"px";
    $("zoomLabel").textContent=Math.round(viewScale*100)+"%";
  }
  function fitZoom(){
    const vp=$("viewport"),c=project.canvas;
    const s=Math.min((vp.clientWidth-60)/c.w,(vp.clientHeight-60)/c.h,1);
    viewScale=Math.max(.05,s);applyZoom();
  }
  $("zoomIn").onclick=()=>{viewScale=Math.min(3,viewScale+.1);applyZoom();};
  $("zoomOut").onclick=()=>{viewScale=Math.max(.1,viewScale-.1);applyZoom();};
  $("zoomFit").onclick=fitZoom;

  /* ---------- 工具栏事件 ---------- */
  $("btnUndo").onclick=undo;
  $("btnAddPage").onclick=()=>{snapshot();const pg={id:uid(),name:"页面 "+(project.pages.length+1),elements:[]};
    project.pages.push(pg);project.activePageId=pg.id;selectedId=null;renderAll();persist();toast("已新建页面");};
  $("projectName").onchange=e=>{snapshot();project.name=e.target.value||"未命名项目";persist();};
  $("canvasColor").onchange=e=>{snapshot();project.canvas.bg=e.target.value;renderCanvas();persist();};
  ["canvasW","canvasH"].forEach(id=>$(id).onchange=e=>{
    const v=Math.max(100,Math.min(6000,parseInt(e.target.value)||100));
    snapshot();project.canvas[id==="canvasW"?"w":"h"]=v;renderCanvas();persist();});

  /* ---------- 上传 ---------- */
  $("btnUpload").onclick=()=>$("fileInput").click();
  $("fileInput").onchange=ev=>{
    const files=[...ev.target.files];if(!files.length)return;
    snapshot();let left=files.length;
    files.forEach(f=>{
      const reader=new FileReader();
      reader.onload=()=>{
        project.assets.push({id:uid(),name:f.name.replace(/\.[^.]+$/,""),data:reader.result,preset:false});
        if(--left===0){renderAssets();persist();toast("已上传 "+files.length+" 张图片");}
      };
      reader.readAsDataURL(f);
    });
    ev.target.value="";
  };

  /* ---------- 预览 ---------- */
  function openPreview(){
    const p=$("preview"),pc=$("previewCanvas"),c=project.canvas;
    pc.innerHTML="";pc.style.width=c.w+"px";pc.style.height=c.h+"px";pc.style.background=c.bg;
    selectedPage().elements.slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(e=>{
      if(!e.visible)return;const asset=findAsset(e.assetId);if(!asset)return;
      const img=document.createElement("img");img.src=asset.data;
      img.style.left=e.x+"px";img.style.top=e.y+"px";img.style.width=e.w+"px";img.style.height=e.h+"px";
      img.style.transform="rotate("+e.rot+"deg)";img.style.opacity=e.opacity;
      pc.appendChild(img);
    });
    p.classList.add("on");
    const s=Math.min((innerWidth-60)/c.w,(innerHeight-80)/c.h,1);
    pc.style.transform="scale("+s+")";
  }
  function closePreview(){$("preview").classList.remove("on");}
  $("btnPreview").onclick=openPreview;
  $("preview").onclick=closePreview;

  /* ---------- 导入导出 ---------- */
  $("btnExport").onclick=()=>{
    const data=JSON.stringify(project,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=(project.name||"排版项目")+"-"+new Date().toISOString().slice(0,10)+".json";
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("已导出完整项目（含素材）");
  };
  $("btnImport").onclick=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
    inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{const p=normalize(JSON.parse(r.result));snapshot();project=p;selectedId=null;
          renderAll();persist();toast("已导入项目："+project.name);}
        catch(e){toast("导入失败：文件格式不正确");}
      };
      r.readAsText(f);
    };inp.click();
  };

  /* ---------- 键盘 ---------- */
  window.addEventListener("keydown",ev=>{
    if($("preview").classList.contains("on")){if(ev.key==="Escape")closePreview();return;}
    const tag=(ev.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea")return;
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();undo();return;}
    if((ev.key==="Delete"||ev.key==="Backspace")&&selectedId){
      snapshot();selectedPage().elements=selectedPage().elements.filter(x=>x.id!==selectedId);
      selectedId=null;renderAll();persist();toast("已删除画布元素");return;}
    if(ev.key==="Escape"){selectedId=null;renderCanvas();renderLayers();renderProps();}
  });
  window.addEventListener("resize",()=>{if($("preview").classList.contains("on"))openPreview();});

  /* ---------- 多窗口同步 ---------- */
  function setupSync(){
    try{bc=new BroadcastChannel(CHANNEL);
      bc.onmessage=ev=>{
        if(!ev.data||ev.data.from===CLIENT_ID||applyingRemote)return;
        applyingRemote=true;
        if(ev.data.data.updatedAt>(project.updatedAt||0)){
          const keepUndo=undoStack;project=normalize(ev.data.data);undoStack=keepUndo;
          if(!project.pages.some(p=>p.id===selectedPageId()))selectedId=null;
          renderAll();toast("已同步其他窗口的更改");
        }
        applyingRemote=false;
      };
    }catch(e){}
    window.addEventListener("storage",ev=>{
      if(ev.key!==STORE_KEY||!ev.newValue||applyingRemote)return;
      try{const p=normalize(JSON.parse(ev.newValue));
        if(p.updatedAt>(project.updatedAt||0)){
          applyingRemote=true;project=p;renderAll();toast("已同步其他窗口的更改");applyingRemote=false;
        }}catch(e){}
    });
  }

  /* ---------- 工具 ---------- */
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  let toastTimer;function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),2000);}

  /* ---------- 启动 ---------- */
  load();setupSync();renderAll();updateUndoBtn();
  requestAnimationFrame(fitZoom);
})();
</script>
</body>
</html>
